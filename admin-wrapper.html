<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Needoh Squish World</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#11162a}#game{display:block;width:100%;height:100%;border:0;background:#11162a}
</style>
</head>
<body>
<iframe id="game" src="/index.html" title="Needoh Squish World"></iframe>
<script>
const game=document.getElementById('game');
game.addEventListener('load',()=>{
  try{
    const d=game.contentDocument;
    const global=d.createElement('script');
    global.src='/supabase-global.js?v=3';
    global.async=false;
    global.onerror=()=>console.error('Could not load Supabase game integration');
    d.body.appendChild(global);
  }catch(e){console.error('Could not load game integration',e)}
});
</script>
</body>
</html>
