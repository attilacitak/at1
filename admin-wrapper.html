<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Needoh Squish World</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#11162a}#game{display:block;width:100%;height:100%;border:0;background:#11162a}</style>
</head>
<body>
<iframe id="game" src="/raw-game?v=13" title="Needoh Squish World"></iframe>
<script>
const game=document.getElementById('game');
const scripts=[
'/account-in-game.js?v=1','/online.js?v=2','/admin-take.js?v=2','/broadcast.js?v=1','/global-codes.js?v=1','/mystery-wheel.js?v=1','/coin-rush.js?v=2','/boss-cinematic.js?v=1','/admin-grants.js?v=1','/kick-players.js?v=1','/admin-auth.js?v=1','/world5-limited.js?v=1','/events-rewards.js?v=2','/social-admin.js?v=2','/enhanced-boxes.js?v=2','/enhanced-boss.js?v=1','/attila-squishy.js?v=3','/attila-face-fix.js?v=3','/final-fixes.js?v=1','/event-banner-corner.js?v=7','/auction-popup-fix.js?v=4'
];
function loadScripts(d,i=0){
 if(i>=scripts.length)return;
 const s=d.createElement('script');s.src=scripts[i];s.async=false;
 s.onload=()=>loadScripts(d,i+1);
 s.onerror=()=>{console.error('Could not load',scripts[i]);loadScripts(d,i+1)};
 d.body.appendChild(s);
}
game.addEventListener('load',()=>{
 try{
   const d=game.contentDocument;
   if(!d||d.documentElement.dataset.needohIntegrationLoaded==='1')return;
   d.documentElement.dataset.needohIntegrationLoaded='1';
   loadScripts(d);
 }catch(e){console.error('Could not load game integration',e)}
});
</script>
</body>
</html>
