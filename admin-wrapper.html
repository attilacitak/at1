<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Needoh Squish World</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#11162a}#game{display:block;width:100%;height:100%;border:0;background:#11162a;pointer-events:auto;position:relative;z-index:1}</style>
</head>
<body>
<iframe id="game" src="about:blank" title="Needoh Squish World" tabindex="0"></iframe>
<script src="/account-gate.js?v=2"></script>
<script>
const gameFrame=document.getElementById('game');
const scripts=[
'/online.js?v=2','/admin-take.js?v=2','/broadcast.js?v=1','/global-codes.js?v=1','/mystery-wheel.js?v=1','/coin-rush.js?v=2','/boss-cinematic.js?v=1','/admin-grants.js?v=1','/kick-players.js?v=1','/admin-auth.js?v=1','/world5-limited.js?v=1','/events-rewards.js?v=2','/social-admin.js?v=2','/enhanced-boxes.js?v=2','/enhanced-boss.js?v=1','/attila-squishy.js?v=3','/attila-face-fix.js?v=3','/final-fixes.js?v=1','/event-banner-corner.js?v=6','/account-sync.js?v=1','/interaction-rescue.js?v=1'
];
function loadScripts(d,i=0){
 if(i>=scripts.length)return;
 const s=d.createElement('script');s.src=scripts[i];s.async=false;
 s.onload=()=>loadScripts(d,i+1);
 s.onerror=()=>{console.error('Could not load',scripts[i]);loadScripts(d,i+1)};
 d.body.appendChild(s);
}
gameFrame.addEventListener('load',()=>{
 if(!String(gameFrame.getAttribute('src')||'').startsWith('/raw-game'))return;
 const blocker=document.getElementById('needohAccountGate');
 if(blocker){blocker.style.pointerEvents='none';blocker.remove();}
 Object.assign(gameFrame.style,{visibility:'visible',pointerEvents:'auto',position:'fixed',inset:'0',width:'100%',height:'100%',zIndex:'2147483647'});
 gameFrame.removeAttribute('inert');
 for(const el of [...document.body.children]){
   if(el!==gameFrame&&el.tagName!=='SCRIPT'&&el.tagName!=='STYLE')el.style.pointerEvents='none';
 }
 try{loadScripts(gameFrame.contentDocument)}catch(e){console.error('Could not load game integration',e)}
 setTimeout(()=>{try{gameFrame.contentWindow.focus()}catch(_){}},50);
});
</script>
</body>
</html>
