<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Needoh Account</title>
<style>
:root{--text:#fff;--muted:#c8c7d7;--accent:#7cf7d4;--danger:#ff8ba0}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-rounded,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);background:radial-gradient(circle at 15% 12%,rgba(68,232,201,.18),transparent 27%),radial-gradient(circle at 86% 16%,rgba(193,79,255,.20),transparent 29%),linear-gradient(135deg,#10162b,#28143f)}
body{min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(500px,100%);padding:28px;border-radius:26px;background:rgba(255,255,255,.075);border:1px solid rgba(255,255,255,.14);box-shadow:0 28px 100px rgba(0,0,0,.45)}
.logo{text-align:center;font-size:50px}.title{text-align:center;margin:4px 0 3px;font-size:30px;font-weight:1000}.sub{text-align:center;color:var(--muted);font-size:13px;line-height:1.5;margin:0 0 18px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:7px;padding:5px;background:rgba(0,0,0,.3);border-radius:15px;margin-bottom:14px}.tab{border:0;border-radius:11px;padding:11px;background:transparent;color:#ccc9dc;font-weight:900;cursor:pointer}.tab.on{background:linear-gradient(135deg,#21d8ae,#666cff);color:#fff}.label{display:block;font-size:12px;color:#cfcede;font-weight:850;margin-top:10px}.input{width:100%;border:1px solid rgba(255,255,255,.18);background:rgba(0,0,0,.26);color:#fff;border-radius:14px;padding:13px 14px;font-size:16px;outline:none;margin-top:5px}.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(124,247,212,.13)}.check{display:flex;gap:9px;align-items:flex-start;padding:11px;margin:12px 0;background:rgba(255,217,94,.08);border:1px solid rgba(255,217,94,.20);border-radius:13px;color:#ffe99d;font-size:12px;line-height:1.38}.check input{margin-top:2px}.btn{width:100%;border:0;border-radius:14px;padding:14px;margin-top:13px;color:#fff;font-weight:1000;font-size:16px;cursor:pointer;background:linear-gradient(135deg,#1fd5a9,#6467ff)}.btn:disabled{opacity:.55;cursor:wait}.error{min-height:20px;margin-top:10px;text-align:center;color:var(--danger);font-size:13px;font-weight:850}.foot{text-align:center;color:#aaa8c2;font-size:11px;line-height:1.45;margin-top:10px}.loading{text-align:center;padding:24px 0}.spinner{width:44px;height:44px;border:4px solid rgba(255,255,255,.16);border-top-color:var(--accent);border-radius:50%;margin:0 auto 14px;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.secondary{margin-top:10px;background:rgba(255,255,255,.12)}
</style>
</head>
<body>
<main class="card" id="app"></main>
<script>
(()=>{
const SB='https://xawvgrktcqbtmcbpuizg.supabase.co';
const KEY='sb_publishable_PjR-iiuLbcoFqzjF8W-7Rg_S4X5cWwa';
const H={apikey:KEY,'Content-Type':'application/json'};
const SAVE_KEY='needohSquishWorldSaveV2',PLAYER_KEY='needohPlayerName',SESSION_KEY='needohAccountSessionV1',ACCOUNT_NAME_KEY='needohAccountNameV1';
const EXTRA_KEYS=['needohAdventureV4','needohAdventureV3','needohAdventureFinalV1','needohAdventureProgressFixV2'];
const app=document.getElementById('app');let mode='login',busy=false;
function readJson(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(_){return null}}
function localEnvelope(){const state=readJson(SAVE_KEY);if(!state)return null;const extras={};for(const k of EXTRA_KEYS){const v=readJson(k);if(v!==null)extras[k]=v}return{__needohCloudVersion:2,state,extras}}
function applyCloud(data,name){localStorage.setItem(PLAYER_KEY,String(name||'Player'));if(!data)return;if(data.__needohCloudVersion&&data.state&&typeof data.state==='object'){localStorage.setItem(SAVE_KEY,JSON.stringify(data.state));const extras=data.extras&&typeof data.extras==='object'?data.extras:{};for(const k of EXTRA_KEYS){if(Object.prototype.hasOwnProperty.call(extras,k)&&extras[k]!=null)localStorage.setItem(k,JSON.stringify(extras[k]));else localStorage.removeItem(k)}return}if(typeof data==='object')localStorage.setItem(SAVE_KEY,JSON.stringify(data))}
function clearSession(){localStorage.removeItem(SESSION_KEY);localStorage.removeItem(ACCOUNT_NAME_KEY)}
function storeSession(token,name){localStorage.setItem(SESSION_KEY,token);localStorage.setItem(ACCOUNT_NAME_KEY,name);localStorage.setItem(PLAYER_KEY,name)}
async function rpc(name,body={},timeout=7000){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),timeout);try{const r=await fetch(`${SB}/rest/v1/rpc/${name}`,{method:'POST',headers:H,body:JSON.stringify(body),signal:controller.signal});const text=await r.text();if(!r.ok)throw new Error(text||`Account request failed (${r.status})`);return text?JSON.parse(text):null}finally{clearTimeout(timer)}}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;')}
function errorText(code){if(code==='NAME_TAKEN')return'That player name already has an account.';if(code==='NAME_INVALID')return'Use 2–20 characters: letters, numbers, spaces, _ or -.';if(code==='PASSWORD_INVALID')return'Password must be at least 8 characters.';if(code==='INVALID_LOGIN')return'Player name or password is incorrect.';if(code==='LOCKED')return'Too many incorrect attempts. Try again in about 10 minutes.';if(code==='SAVE_TOO_LARGE')return'That local save is too large to import.';if(code==='OWNER_RESERVED')return'Attila is reserved for the game owner.';if(code==='OWNER_AUTH_REQUIRED')return'The Attila admin password is incorrect.';return'Could not sign in. Please try again.'}
function setError(t=''){const e=document.getElementById('err');if(e)e.textContent=t}
function hasLocal(){return !!readJson(SAVE_KEY)}
function renderForm(message=''){
 const old=(localStorage.getItem(ACCOUNT_NAME_KEY)||localStorage.getItem(PLAYER_KEY)||'').slice(0,20);
 app.innerHTML=`<div class="logo">🫧</div><div class="title">Needoh Squish World</div><p class="sub">Sign in to restore your progress on any computer. The account page disappears completely before the game starts.</p><div class="tabs"><button class="tab ${mode==='login'?'on':''}" id="loginTab">LOG IN</button><button class="tab ${mode==='create'?'on':''}" id="createTab">CREATE ACCOUNT</button></div><label class="label">PLAYER NAME</label><input class="input" id="name" maxlength="20" autocomplete="username" value="${esc(old)}"><label class="label">PASSWORD</label><input class="input" id="pass" type="password" maxlength="128" autocomplete="${mode==='create'?'new-password':'current-password'}" placeholder="At least 8 characters">${mode==='create'?`<label class="label">CONFIRM PASSWORD</label><input class="input" id="confirm" type="password" maxlength="128" autocomplete="new-password" placeholder="Type password again"><div id="ownerBox"></div>${hasLocal()?'<label class="check"><input id="importLocal" type="checkbox" checked><span><b>Import progress already on this device</b><br>Your current coins, squishies, Forge items and Adventure progress will become this account’s starting save.</span></label>':''}`:''}<button class="btn" id="go">${mode==='create'?'CREATE ACCOUNT & PLAY':'LOG IN & PLAY'}</button><div class="error" id="err">${esc(message)}</div><div class="foot">Passwords are stored as secure hashes, not plain text. Username-only accounts do not have email password recovery.</div>`;
 document.getElementById('loginTab').onclick=()=>{if(!busy){mode='login';renderForm()}};document.getElementById('createTab').onclick=()=>{if(!busy){mode='create';renderForm()}};document.getElementById('go').onclick=submit;
 const ownerField=()=>{const box=document.getElementById('ownerBox');if(!box)return;const own=String(document.getElementById('name')?.value||'').trim().toLowerCase()==='attila';box.innerHTML=own?'<label class="label">ATTILA ADMIN PASSWORD</label><input class="input" id="ownerPass" type="password" maxlength="128" placeholder="Required for the owner account"><div class="check"><span>👑 Attila is reserved for the game owner.</span></div>':'';document.getElementById('ownerPass')?.addEventListener('keydown',e=>{if(e.key==='Enter')submit()})};
 document.getElementById('name').addEventListener('input',ownerField);ownerField();['name','pass','confirm'].forEach(id=>document.getElementById(id)?.addEventListener('keydown',e=>{if(e.key==='Enter')submit()}));
}
async function enterGame(result){const name=String(result?.player_name||'Player');storeSession(result.session_token,name);applyCloud(result.save_data??null,name);location.replace('/raw-game?v=12')}
async function submit(){if(busy)return;const name=String(document.getElementById('name')?.value||'').replace(/\s+/g,' ').trim(),password=String(document.getElementById('pass')?.value||'');if(name.length<2)return setError('Enter a player name with at least 2 characters.');if(password.length<8)return setError('Password must be at least 8 characters.');if(mode==='create'&&password!==String(document.getElementById('confirm')?.value||''))return setError('The passwords do not match.');busy=true;const b=document.getElementById('go');b.disabled=true;b.textContent='CONNECTING…';setError('');try{let r;if(mode==='create'){const initial=document.getElementById('importLocal')?.checked?localEnvelope():null;if(name.toLowerCase()==='attila'){const ap=String(document.getElementById('ownerPass')?.value||'');if(!ap){setError('Enter the Attila admin password.');return}r=await rpc('needoh_account_create_owner',{p_player_name:name,p_password:password,p_initial_save:initial,p_admin_password:ap})}else r=await rpc('needoh_account_create',{p_player_name:name,p_password:password,p_initial_save:initial})}else r=await rpc('needoh_account_login',{p_player_name:name,p_password:password});if(!r?.ok){setError(errorText(r?.error));return}await enterGame(r)}catch(e){console.warn(e);setError(e?.name==='AbortError'?'Account server took too long. Try again.':'Could not connect to the account server.')}finally{busy=false;if(document.getElementById('go')){b.disabled=false;b.textContent=mode==='create'?'CREATE ACCOUNT & PLAY':'LOG IN & PLAY'}}}
async function resume(){const token=localStorage.getItem(SESSION_KEY);if(!token)return renderForm();app.innerHTML='<div class="logo">🫧</div><div class="title">Needoh Squish World</div><div class="loading"><div class="spinner"></div><b>Restoring your account…</b><p class="sub">This check will stop automatically if the server does not respond.</p></div><button class="btn secondary" id="cancelResume">USE LOGIN SCREEN</button>';document.getElementById('cancelResume').onclick=()=>{clearSession();renderForm('Saved login cleared. Log in again.')};try{const r=await rpc('needoh_account_resume',{p_session_token:token},6000);if(r?.ok){storeSession(token,r.player_name);applyCloud(r.save_data??null,r.player_name);location.replace('/raw-game?v=12');return}clearSession();renderForm('Your saved login expired. Log in again.')}catch(e){clearSession();renderForm('Could not restore the saved session. Log in again.') }}
resume();
})();
</script>
</body>
</html>
